<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <title>patrocinadores</title>
  <style>
    * {
      box-sizing: border-box;

    }

    body {
      background-color: rgb(34, 34, 34);
    }

    section {
      margin-top: 100px;
      background-color: black;
      border: 2px solid white;
      box-shadow:
        0 0 10px rgba(255, 255, 255, 1),
        0 0 20px rgba(255, 255, 255, 0.8),
        0 0 35px rgba(255, 255, 255, 0.6),
        0 0 50px rgba(255, 255, 255, 0.4);
    }

    #patro-titulo {
      text-align: center;
      justify-content: center;
      color: white;
    }

    #patro-fila {
      border: 1px solid red;
      max-width: 800px;
    }

    .imgpatro {
      text-align: center;
      justify-content: center;
       /*border: 1px solid green; */
      padding: 15px;
    }
  </style>
</head>

<body>
  <section class="container">
    <!-- TITULO-->
    <div class="row my-3 d-flex" id="patro-titulo">
      <h2>PATROCINADORES</h2>
    </div>
    <!-- IMAGENES PATROCINADORES-->
    <div class="row  mx-auto my-4" id="patro-fila">

      <div class="col-12 col-md-3 imgpatro"  >
        <img src="./sources/estrella-galicia-10.png" />
      </div>

      <div class="col-12 col-md-3 imgpatro"  >
        <img src="./sources/ponflicks0.png" />
      </div>

      <div class="col-12 col-md-3 imgpatro" >
        <img src="./sources/supreme0.png" />
      </div>

      <div class="col-12 col-md-3 imgpatro"  >
        <img src="./sources/wolf-pit0.png" />
      </div>

    </div>
  </section>
</body>

</html>
